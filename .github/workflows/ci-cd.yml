name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.image-name.outputs.image_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image-name
        shell: bash
        run: echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image-name.outputs.image_name }}:${{ github.sha }}
            ${{ steps.image-name.outputs.image_name }}:latest

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy through AWS Systems Manager
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
          IMAGE_NAME: ${{ needs.publish.outputs.image_name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          COMMANDS=$(jq -n \
            --arg app_dir "$APP_DIR" \
            --arg image_name "$IMAGE_NAME" \
            --arg image_tag "$IMAGE_TAG" \
            '{commands:[
              "set -eu",
              ("cd " + ($app_dir | @sh)),
              ("export IMAGE_NAME=" + ($image_name | @sh)),
              ("export IMAGE_TAG=" + ($image_tag | @sh)),
              "docker compose -f compose.yaml -f compose.prod.yaml pull",
              "docker compose -f compose.yaml -f compose.prod.yaml up -d --remove-orphans",
              "docker image prune -f"
            ]}')

          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --comment "MaintAI deploy $IMAGE_TAG" \
            --parameters "$COMMANDS" \
            --query 'Command.CommandId' \
            --output text)

          for attempt in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "SSM command did not finish in time: $COMMAND_ID"
          exit 1
